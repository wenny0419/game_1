<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>歡樂打地鼠 - 經典點擊挑戰</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #1b3a2b 0%, #2e5a44 50%, #163828 100%);
      --card-bg: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.2);
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --accent: #10b981;
      --crown-gold: #fbbf24;
      --text: #f8fafc;
      --text-muted: #cbd5e1;
      --hole-dirt: #452e1b;
      --hole-rim: #5c3e24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-gradient);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow-x: hidden;
      position: relative;
    }

    /* 背景柔光裝飾 */
    .bg-bubble {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }
    .bg-bubble-1 {
      width: 280px;
      height: 280px;
      background: rgba(16, 185, 129, 0.15);
      top: 5%;
      left: 10%;
    }
    .bg-bubble-2 {
      width: 320px;
      height: 320px;
      background: rgba(245, 158, 11, 0.12);
      bottom: 5%;
      right: 10%;
    }

    .game-container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 20px 16px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    /* 頂部標題列 */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .title-wrap h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ffffff 40%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-wrap p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .sound-toggle-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.15rem;
      transition: all 0.2s ease;
    }
    .sound-toggle-btn:active {
      transform: scale(0.9);
    }

    /* 資訊面板：得分、剩餘時間、第一名榜首 */
    .stats-panel {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .stat-card {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 10px 4px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .stat-card.top1-card {
      border-color: rgba(251, 191, 36, 0.4);
      background: linear-gradient(180deg, rgba(251, 191, 36, 0.15) 0%, rgba(0, 0, 0, 0.3) 100%);
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .stat-value {
      font-size: 1.45rem;
      font-weight: 800;
      color: #ffffff;
      margin-top: 4px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .top1-card .stat-value {
      color: var(--crown-gold);
      text-shadow: 0 0 12px rgba(251, 191, 36, 0.4);
    }

    /* 3x3 地鼠洞區域 */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 6px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .hole {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      background: radial-gradient(ellipse at 50% 70%, var(--hole-dirt) 30%, #2b1d12 75%, var(--hole-rim) 100%);
      box-shadow: inset 0 8px 14px rgba(0, 0, 0, 0.8),
                  0 4px 8px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    /* 洞口泥土邊緣 */
    .hole-rim {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 26%;
      background: linear-gradient(180deg, #6b4728 0%, #4a2f17 100%);
      border-radius: 0 0 18px 18px;
      border-top: 3px solid #825732;
      box-shadow: 0 -2px 6px rgba(0, 0, 0, 0.4);
      z-index: 3;
      pointer-events: none;
    }

    /* 地鼠模型 */
    .mole {
      position: absolute;
      width: 78%;
      height: 86%;
      bottom: -95%;
      transition: bottom 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.25);
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .hole.up .mole {
      bottom: 12%;
      pointer-events: auto;
    }

    .hole.hit .mole {
      transform: scale(0.92) translateY(8px);
      transition: transform 0.1s ease, bottom 0.2s ease;
      bottom: -95% !important;
      pointer-events: none;
    }

    .mole-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.4));
      transition: transform 0.15s ease;
    }

    /* 地鼠被敲中時的眼冒金星表情 */
    .mole-eyes-normal {
      display: block;
    }
    .mole-eyes-dizzy {
      display: none;
    }
    .hole.hit .mole-eyes-normal {
      display: none;
    }
    .hole.hit .mole-eyes-dizzy {
      display: block;
    }

    /* 浮動加分特效 (+1) */
    .float-score {
      position: absolute;
      font-size: 1.5rem;
      font-weight: 900;
      color: #fde047;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6), 0 0 10px #f59e0b;
      pointer-events: none;
      z-index: 10;
      animation: floatUp 0.65s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      left: 50%;
      top: 30%;
      transform: translate(-50%, 0);
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translate(-50%, 20px) scale(0.6);
      }
      30% {
        opacity: 1;
        transform: translate(-50%, -10px) scale(1.3);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -40px) scale(1);
      }
    }

    /* 敲擊光芒 */
    .whack-spark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      pointer-events: none;
      z-index: 9;
      animation: sparkBurst 0.4s ease-out forwards;
    }

    @keyframes sparkBurst {
      0% {
        transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.4) rotate(45deg);
        opacity: 0;
      }
    }

    /* 控制按鈕區 */
    .action-panel {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 14px 18px;
      border: none;
      border-radius: 18px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
    }

    .btn:active {
      transform: translateY(2px) scale(0.98);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .btn-start {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .btn-start:hover {
      background: linear-gradient(135deg, #34d399 0%, #059669 100%);
    }

    .btn-reset {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.18);
      flex: 0.65;
    }

    /* 遊戲結束結算彈窗 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #1e3a2b;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 28px;
      width: 100%;
      max-width: 360px;
      padding: 28px 20px 24px;
      text-align: center;
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-emoji {
      font-size: 3.5rem;
      margin-bottom: 8px;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    .modal-title {
      font-size: 1.45rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .modal-badge {
      display: inline-block;
      padding: 5px 14px;
      background: rgba(251, 191, 36, 0.2);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: #fbbf24;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 99px;
      margin-bottom: 16px;
    }

    .score-summary-box {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .summary-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .summary-label {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .summary-val {
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
    }

    .summary-val.highlight {
      color: var(--crown-gold);
    }
  </style>
</head>
<body>

  <!-- 背景氛圍光源 -->
  <div class="bg-bubble bg-bubble-1"></div>
  <div class="bg-bubble bg-bubble-2"></div>

  <div class="game-container">
    <!-- 頂部標題與音效按鈕 -->
    <header class="header">
      <div class="title-wrap">
        <h1>🐾 歡樂打地鼠</h1>
        <p>每點一下分數 +1，挑戰歷史第一名！</p>
      </div>
      <button class="sound-toggle-btn" id="soundToggleBtn" aria-label="切換音效">🔊</button>
    </header>

    <!-- 狀態面板 -->
    <section class="stats-panel">
      <div class="stat-card">
        <div class="stat-label">🎯 本局分數</div>
        <div class="stat-value" id="currentScore">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">⏳ 剩餘時間</div>
        <div class="stat-value" id="timer">30 秒</div>
      </div>
      <div class="stat-card top1-card">
        <div class="stat-label">👑 歷史第一名</div>
        <div class="stat-value" id="topScore">0</div>
      </div>
    </section>

    <!-- 3x3 地鼠洞區域 -->
    <main class="grid" id="grid">
      <!-- 9 個地鼠洞由腳本渲染 -->
    </main>

    <!-- 底部操作按鈕 -->
    <footer class="action-panel">
      <button class="btn btn-start" id="startBtn">
        <span>🎮 開始遊戲</span>
      </button>
      <button class="btn btn-reset" id="resetTopBtn" title="清除最高分紀錄">
        <span>🗑️ 清除紀錄</span>
      </button>
    </footer>
  </div>

  <!-- 結算彈窗 -->
  <div class="modal-overlay" id="gameOverModal">
    <div class="modal-card">
      <div class="modal-emoji" id="modalEmoji">🎉</div>
      <h2 class="modal-title" id="modalTitle">挑戰結束！</h2>
      <div class="modal-badge" id="modalBadge">全新第一名紀錄誕生！</div>

      <div class="score-summary-box">
        <div class="summary-item">
          <span class="summary-label">本局獲得</span>
          <span class="summary-val" id="summaryScore">0</span>
        </div>
        <div style="width: 1px; height: 32px; background: rgba(255,255,255,0.15);"></div>
        <div class="summary-item">
          <span class="summary-label">歷史第一名</span>
          <span class="summary-val highlight" id="summaryTop">0</span>
        </div>
      </div>

      <button class="btn btn-start" id="playAgainBtn" style="width: 100%;">
        <span>🔄 再玩一次</span>
      </button>
    </div>
  </div>

  <script>
    /* ========================================================
       1. 音效系統 (使用 Web Audio API，無需外載檔案，零延遲且支援離線)
       ======================================================== */
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // 擊中地鼠的敲擊聲
      playHit() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.12);

        gain.gain.setValueAtTime(0.8, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.12);
      }

      // 地鼠鑽出的輕快聲
      playPop() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(540, now + 0.09);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.09);
      }

      // 榮登第一名歡呼號角聲
      playVictory() {
        if (!this.enabled || !this.ctx) return;
        const notes = [330, 440, 554, 659];
        notes.forEach((freq, idx) => {
          const now = this.ctx.currentTime + idx * 0.1;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.25);
        });
      }

      // 遊戲結束音效
      playGameOver() {
        if (!this.enabled || !this.ctx) return;
        const notes = [440, 392, 349, 293];
        notes.forEach((freq, idx) => {
          const now = this.ctx.currentTime + idx * 0.12;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.2);
        });
      }
    }

    const sfx = new SoundFX();

    /* ========================================================
       2. 可愛地鼠 SVG 向量圖形 (含平常與眼冒金星表情)
       ======================================================== */
    const moleSVGContent = `
      <svg class="mole-svg" viewBox="0 0 140 150" xmlns="http://www.w3.org/2000/svg">
        <!-- 耳朵外圈 -->
        <circle cx="34" cy="42" r="18" fill="#935732" />
        <circle cx="106" cy="42" r="18" fill="#935732" />
        <!-- 耳朵內粉 -->
        <circle cx="34" cy="42" r="11" fill="#f4a5b6" />
        <circle cx="106" cy="42" r="11" fill="#f4a5b6" />

        <!-- 身體與肚肚 -->
        <ellipse cx="70" cy="85" rx="52" ry="58" fill="#a7683e" />
        <ellipse cx="70" cy="98" rx="38" ry="36" fill="#fce4cc" />

        <!-- 正常眼睛表情 -->
        <g class="mole-eyes-normal">
          <ellipse cx="50" cy="74" rx="7" ry="9" fill="#20150d" />
          <circle cx="48" cy="71" r="3" fill="#ffffff" />
          <ellipse cx="90" cy="74" rx="7" ry="9" fill="#20150d" />
          <circle cx="88" cy="71" r="3" fill="#ffffff" />
        </g>

        <!-- 擊中眼冒金星表情 -->
        <g class="mole-eyes-dizzy">
          <!-- 左眼叉叉 -->
          <line x1="44" y1="68" x2="56" y2="80" stroke="#20150d" stroke-width="4" stroke-linecap="round" />
          <line x1="56" y1="68" x2="44" y2="80" stroke="#20150d" stroke-width="4" stroke-linecap="round" />
          <!-- 右眼叉叉 -->
          <line x1="84" y1="68" x2="96" y2="80" stroke="#20150d" stroke-width="4" stroke-linecap="round" />
          <line x1="96" y1="68" x2="84" y2="80" stroke="#20150d" stroke-width="4" stroke-linecap="round" />
        </g>

        <!-- 可愛腮紅 -->
        <ellipse cx="38" cy="88" rx="7" ry="4" fill="#f87171" opacity="0.75" />
        <ellipse cx="102" cy="88" rx="7" ry="4" fill="#f87171" opacity="0.75" />

        <!-- 鼻子 -->
        <polygon points="70,82 62,91 78,91" fill="#361a0d" />

        <!-- 嘴巴與小門牙 -->
        <path d="M 64 92 Q 70 98 76 92" stroke="#361a0d" stroke-width="3" fill="none" stroke-linecap="round" />
        <rect x="67" y="93" width="6" height="7" rx="1.5" fill="#ffffff" stroke="#361a0d" stroke-width="1.5" />

        <!-- 小手爪 -->
        <ellipse cx="40" cy="130" rx="11" ry="8" fill="#935732" />
        <ellipse cx="100" cy="130" rx="11" ry="8" fill="#935732" />
      </svg>
    `;

    /* ========================================================
       3. 遊戲邏輯與狀態管理
       ======================================================== */
    const GAME_DURATION = 30; // 每局 30 秒
    const STORAGE_KEY = 'whack_mole_top1_score';

    let score = 0;
    let topScore = 0;
    let timeLeft = GAME_DURATION;
    let isPlaying = false;
    let timerInterval = null;
    let moleTimeout = null;
    let lastHoleIndex = -1;

    // 取得 DOM 節點
    const gridEl = document.getElementById('grid');
    const currentScoreEl = document.getElementById('currentScore');
    const timerEl = document.getElementById('timer');
    const topScoreEl = document.getElementById('topScore');
    const startBtn = document.getElementById('startBtn');
    const resetTopBtn = document.getElementById('resetTopBtn');
    const soundToggleBtn = document.getElementById('soundToggleBtn');

    // 彈窗節點
    const modalOverlay = document.getElementById('gameOverModal');
    const modalEmoji = document.getElementById('modalEmoji');
    const modalTitle = document.getElementById('modalTitle');
    const modalBadge = document.getElementById('modalBadge');
    const summaryScoreEl = document.getElementById('summaryScore');
    const summaryTopEl = document.getElementById('summaryTop');
    const playAgainBtn = document.getElementById('playAgainBtn');

    // 初始化 9 個洞口
    function createGrid() {
      gridEl.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const hole = document.createElement('div');
        hole.className = 'hole';
        hole.dataset.index = i;

        const mole = document.createElement('div');
        mole.className = 'mole';
        mole.innerHTML = moleSVGContent;

        const rim = document.createElement('div');
        rim.className = 'hole-rim';

        hole.appendChild(mole);
        hole.appendChild(rim);

        // 監聽 pointerdown 確保手機點擊零延遲
        hole.addEventListener('pointerdown', (e) => handleWhack(e, hole));

        gridEl.appendChild(hole);
      }
    }

    // 讀取歷史第一名分數
    function loadTopScore() {
      const saved = localStorage.getItem(STORAGE_KEY);
      topScore = saved ? parseInt(saved, 10) : 0;
      topScoreEl.textContent = topScore;
    }

    // 更新歷史第一名紀錄
    function updateTopScore(newScore) {
      if (newScore > topScore) {
        topScore = newScore;
        localStorage.setItem(STORAGE_KEY, topScore);
        topScoreEl.textContent = topScore;
        return true;
      }
      return false;
    }

    // 隨機選一個洞口（不重複前一個洞）
    function getRandomHole() {
      const holes = document.querySelectorAll('.hole');
      let idx;
      do {
        idx = Math.floor(Math.random() * holes.length);
      } while (idx === lastHoleIndex);
      lastHoleIndex = idx;
      return holes[idx];
    }

    // 地鼠冒出循環
    function popMole() {
      if (!isPlaying) return;

      const hole = getRandomHole();
      hole.classList.remove('hit');
      hole.classList.add('up');
      sfx.playPop();

      // 隨著時間倒數，地鼠冒出節奏會微幅加快
      const speedFactor = Math.max(0.65, timeLeft / GAME_DURATION);
      const stayDuration = (Math.random() * 500 + 750) * speedFactor;

      moleTimeout = setTimeout(() => {
        hole.classList.remove('up');
        if (isPlaying) {
          const nextInterval = Math.random() * 300 + 200;
          setTimeout(popMole, nextInterval);
        }
      }, stayDuration);
    }

    // 處理敲擊事件
    function handleWhack(e, hole) {
      if (!isPlaying) return;
      if (!hole.classList.contains('up') || hole.classList.contains('hit')) return;

      e.preventDefault();

      hole.classList.remove('up');
      hole.classList.add('hit');

      // 每敲擊一下，分數增加 1
      score += 1;
      currentScoreEl.textContent = score;

      // 手機觸覺震動 (若硬體支援)
      if (navigator.vibrate) {
        navigator.vibrate(25);
      }

      sfx.playHit();
      triggerEffects(hole);

      // 若目前得分超越歷史第一名，立即在看板動態更新
      if (score > topScore) {
        topScoreEl.textContent = score;
      }

      clearTimeout(moleTimeout);
      setTimeout(popMole, 220);
    }

    // 觸發打擊視覺特效 (+1 浮動字與火花)
    function triggerEffects(hole) {
      const floatEl = document.createElement('div');
      floatEl.className = 'float-score';
      floatEl.textContent = '+1';
      hole.appendChild(floatEl);

      const spark = document.createElement('div');
      spark.className = 'whack-spark';
      spark.innerHTML = `
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="18" fill="rgba(253, 224, 71, 0.7)" />
          <polygon points="50,10 58,38 88,40 64,58 72,88 50,70 28,88 36,58 12,40 42,38" fill="#fbbf24" />
        </svg>
      `;
      hole.appendChild(spark);

      setTimeout(() => {
        floatEl.remove();
        spark.remove();
      }, 700);
    }

    // 開始遊戲
    function startGame() {
      sfx.init();

      score = 0;
      timeLeft = GAME_DURATION;
      isPlaying = true;
      currentScoreEl.textContent = '0';
      timerEl.textContent = `${timeLeft} 秒`;
      startBtn.disabled = true;
      startBtn.style.opacity = '0.6';
      startBtn.innerHTML = '<span>🔨 奮力敲擊中...</span>';

      document.querySelectorAll('.hole').forEach(h => {
        h.classList.remove('up', 'hit');
      });

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = `${timeLeft} 秒`;

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);

      clearTimeout(moleTimeout);
      popMole();
    }

    // 遊戲結束結算
    function endGame() {
      isPlaying = false;
      clearInterval(timerInterval);
      clearTimeout(moleTimeout);

      document.querySelectorAll('.hole').forEach(h => {
        h.classList.remove('up');
      });

      startBtn.disabled = false;
      startBtn.style.opacity = '1';
      startBtn.innerHTML = '<span>🎮 開始遊戲</span>';

      const isNewRecord = updateTopScore(score);

      summaryScoreEl.textContent = score;
      summaryTopEl.textContent = topScore;

      if (isNewRecord && score > 0) {
        modalEmoji.textContent = '👑';
        modalTitle.textContent = '太厲害了！新紀錄！';
        modalBadge.textContent = '恭喜榮登歷史第一名榜首寶座！';
        modalBadge.style.display = 'inline-block';
        sfx.playVictory();
      } else {
        modalEmoji.textContent = score > 15 ? '🎉' : '🌱';
        modalTitle.textContent = '本局挑戰結束！';
        const diff = topScore - score;
        modalBadge.textContent = diff > 0 ? `距離第一名還差 ${diff} 分，再接再厲！` : '平歷史第一名紀錄！';
        modalBadge.style.display = 'inline-block';
        sfx.playGameOver();
      }

      modalOverlay.classList.add('active');
    }

    // 切換音效開關
    function toggleSound() {
      sfx.init();
      sfx.enabled = !sfx.enabled;
      soundToggleBtn.textContent = sfx.enabled ? '🔊' : '🔇';
    }

    // 清除歷史紀錄
    function resetTopScore() {
      if (confirm('確定要清除歷史第一名的最高分紀錄嗎？')) {
        localStorage.removeItem(STORAGE_KEY);
        topScore = 0;
        topScoreEl.textContent = '0';
      }
    }

    /* ========================================================
       4. 事件監聽
       ======================================================== */
    startBtn.addEventListener('click', startGame);
    resetTopBtn.addEventListener('click', resetTopScore);
    soundToggleBtn.addEventListener('click', toggleSound);

    playAgainBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
      startGame();
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove('active');
      }
    });

    // 啟動初始化
    createGrid();
    loadTopScore();
  </script>
</body>
</html>
